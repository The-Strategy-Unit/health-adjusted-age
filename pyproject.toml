[project]
name = "health-adjusted-age"
version = "0.1.0"
description = "Health adjusted age ..."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flax>=0.12.3",  # fix 2026-02-09
    "jax>=0.4.38",
    "jaxlib>=0.4.38",
    "matplotlib>=3.10.0",
    "metalog-jax>=0.1.1",
    "numpy>=2.2.1",
    "pandas>=2.2.3",
    "pyarrow>=18.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

# [project.scripts]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# [tool.hatch.build.targets.wheel]
# packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

